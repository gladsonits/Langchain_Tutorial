[project]
name = "langchain-tutorial"
version = "0.1.0"
description = "This is a tutorial for LangChain, a framework for building applications with LLMs."
readme = "README.md"
authors = [
    { name = "gladsonits", email = "gladson.bits@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
langchain-tutorial = "langchain_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
